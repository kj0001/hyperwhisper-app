# On-demand portable Windows x64 build (and optional unsigned Inno Setup installer).
#
# Zero secrets, no Authenticode signing, no Sentry DSN: produces a self-contained
# win-x64 portable folder (including HyperWhisper.WhisperWorker and parakeet-engine)
# uploaded as a downloadable GitHub Actions artifact.
name: Windows Portable Build (x64)

on:
  workflow_dispatch:
    inputs:
      include_installer:
        description: "Also build an unsigned Inno Setup .exe installer"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-portable-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-portable-x64:
    name: Build Portable App (Windows x64, unsigned)
    runs-on: windows-latest
    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ----------------------------------------------------------------
      # 2. Setup .NET 10 SDK
      # ----------------------------------------------------------------
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      # ----------------------------------------------------------------
      # 3. Cache the Rust build (shared with Windows CI)
      # ----------------------------------------------------------------
      - name: Cache cargo registry and target dir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared-core-rs/target
          key: windows-ci-cargo-${{ hashFiles('shared-core-rs/rust-toolchain.toml', 'shared-core-rs/Cargo.lock') }}
          restore-keys: |
            windows-ci-cargo-

      # ----------------------------------------------------------------
      # 4. Build the Rust shared core (x64)
      # ----------------------------------------------------------------
      - name: Build Rust shared core (x64)
        working-directory: shared-core-rs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup show
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

          $dest = "..\app\windows\HyperWhisper\Resources\rust-core\x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\hyperwhisper_core.dll" "$dest\hyperwhisper_core.dll" -Force
          Write-Host "x64 DLL: $((Get-Item "$dest\hyperwhisper_core.dll").Length) bytes"

      # ----------------------------------------------------------------
      # 5. Cache, build, and verify x64 parakeet-engine from source
      # ----------------------------------------------------------------
      - name: Cache x64 parakeet-engine binaries
        id: cache-parakeet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/windows/HyperWhisper/Resources/parakeet-engine/x64
          key: windows-ci-parakeet-x64-v1.13.3-${{ hashFiles('tools/parakeet-engine/**', 'tools/build-parakeet-engine-ci.ps1') }}

      - name: Build and verify x64 parakeet-engine from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "app\windows\HyperWhisper\Resources\parakeet-engine\x64"
          $required = @("parakeet-engine.exe", "sherpa-onnx-c-api.dll", "onnxruntime.dll", "DirectML.dll", "silero_vad.onnx")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing.Count -gt 0) {
            .\tools\build-parakeet-engine-ci.ps1 -WorkDir (Join-Path $env:RUNNER_TEMP "parakeet-build")
          } else {
            .\tools\build-parakeet-engine-ci.ps1 -VerifyOnly
          }
          if ($LASTEXITCODE -ne 0) { throw "build-parakeet-engine-ci.ps1 failed with exit code $LASTEXITCODE" }

      # ----------------------------------------------------------------
      # 6. Publish self-contained Windows x64 app + Whisper worker
      # ----------------------------------------------------------------
      - name: Publish portable Windows x64 app + Whisper worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SENTRY_DSN = ""
          $env:SENTRY_AUTH_TOKEN = ""
          $env:SENTRY_ORG = ""
          $env:SENTRY_PROJECT = ""

          $publishDir = "app\windows\HyperWhisper\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }

          dotnet publish app\windows\HyperWhisper\HyperWhisper.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:SkipWhisperWorkerCopy=true `
            -p:PublishReadyToRun=true `
            -p:SentryUploadSymbols=false `
            -p:SentryUploadSources=false
          if ($LASTEXITCODE -ne 0) { throw "HyperWhisper publish failed with exit code $LASTEXITCODE" }

          $workerDir = Join-Path $publishDir "whisper-worker"
          dotnet publish app\windows\HyperWhisper.WhisperWorker\HyperWhisper.WhisperWorker.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishReadyToRun=true `
            -o $workerDir
          if ($LASTEXITCODE -ne 0) { throw "WhisperWorker publish failed with exit code $LASTEXITCODE" }

      # ----------------------------------------------------------------
      # 7. Verify portable bundle contents
      # ----------------------------------------------------------------
      - name: Verify portable bundle contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = "app\windows\HyperWhisper\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish"
          $requiredFiles = @(
            "HyperWhisper.exe",
            "hyperwhisper_core.dll",
            "Assets\app.ico",
            "parakeet-engine\parakeet-engine.exe",
            "parakeet-engine\sherpa-onnx-c-api.dll",
            "parakeet-engine\onnxruntime.dll",
            "parakeet-engine\DirectML.dll",
            "parakeet-engine\silero_vad.onnx",
            "whisper-worker\HyperWhisper.WhisperWorker.exe",
            "whisper-worker\hyperwhisper_core.dll",
            "whisper-worker\Whisper.net.dll",
            "runtimes\win-x64\native\vulkan\ggml-cpu.dll",
            "runtimes\win-x64\native\cuda12\ggml-cpu.dll"
          )

          foreach ($rel in $requiredFiles) {
            $full = Join-Path $publishDir $rel
            if (-not (Test-Path $full)) {
              throw "Missing required portable bundle file: $full"
            }
          }

          $hashTargets = @(
            "HyperWhisper.exe",
            "hyperwhisper_core.dll",
            "parakeet-engine\parakeet-engine.exe",
            "whisper-worker\HyperWhisper.WhisperWorker.exe"
          )

          $summary = @(
            "## Windows Portable Build (x64, unsigned)",
            "",
            "| File | Size (bytes) | SHA-256 |",
            "|---|---:|---|"
          )

          foreach ($rel in $hashTargets) {
            $full = Join-Path $publishDir $rel
            $size = (Get-Item $full).Length
            $sha256 = (Get-FileHash -Algorithm SHA256 $full).Hash.ToLowerInvariant()
            Write-Host "$rel : $size bytes | SHA256=$sha256"
            $summary += "| ``$rel`` | $size | ``$sha256`` |"
          }

          $summary += @(
            "",
            "### Running in an isolated sandbox on Windows",
            '```powershell',
            '$env:HYPERWHISPER_WINDOWS_APPDATA_ROOT = "$env:TEMP\hyperwhisper-test"',
            '.\HyperWhisper.exe',
            '```'
          )

          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      # ----------------------------------------------------------------
      # 8. Upload portable x64 build artifact
      # ----------------------------------------------------------------
      - name: Upload portable x64 build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyperWhisper-win-x64-portable
          path: app/windows/HyperWhisper/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish
          if-no-files-found: error
          retention-days: 14

      # ----------------------------------------------------------------
      # 9. Optional unsigned Inno Setup .exe installer
      # ----------------------------------------------------------------
      - name: Build unsigned Inno Setup x64 installer
        if: ${{ inputs.include_installer == true }}
        shell: pwsh
        env:
          INNOSETUP_VERSION: 6.7.1
          INNOSETUP_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $probeDir = Join-Path $env:RUNNER_TEMP 'iscc-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probeIss = Join-Path $probeDir 'probe.iss'
          Set-Content -Path $probeIss -Value @(
            '[Setup]',
            'AppName=ISCC probe',
            'AppVersion=1.0',
            'CreateAppDir=no',
            'Uninstallable=no',
            "OutputDir=$probeDir",
            'OutputBaseFilename=iscc-probe'
          )
          function Test-Iscc {
            if (-not (Test-Path $iscc)) { return $false }
            & $iscc /Q $probeIss | Out-Host
            return ($LASTEXITCODE -eq 0)
          }
          if (-not (Test-Iscc)) {
            Write-Host "No working Inno Setup 6 on the runner; installing the pinned $env:INNOSETUP_VERSION."
            $tag = 'is-' + ($env:INNOSETUP_VERSION -replace '\.', '_')
            $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNOSETUP_VERSION.exe"
            $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNOSETUP_VERSION.exe"
            for ($attempt = 1; ; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe
                break
              } catch {
                if ($attempt -ge 5) { throw "Inno Setup download failed after $attempt attempts: $_" }
                $delay = 5 * [math]::Pow(2, $attempt - 1)
                Write-Warning "Inno Setup download attempt $attempt failed: $_; retrying in $delay s"
                Start-Sleep -Seconds $delay
              }
            }
            $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
            if ($hash -ne $env:INNOSETUP_SHA256) { throw "Inno Setup installer SHA-256 $hash does not match the pinned $env:INNOSETUP_SHA256" }
            $proc = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Inno Setup installer exited $($proc.ExitCode)" }
            if (-not (Test-Iscc)) { throw "ISCC at $iscc did not compile a probe script after installing Inno Setup $env:INNOSETUP_VERSION" }
          }
          Write-Host "Using Inno Setup at $iscc"

          New-Item -ItemType Directory -Force -Path "app\windows-installers" | Out-Null
          & $iscc "app\windows\setup-x64.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }

          $installers = Get-ChildItem "app\windows-installers\HyperWhisper-*-x64-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $installers) {
            throw "Expected unsigned x64 installer was not generated under app\windows-installers"
          }
          foreach ($inst in $installers) {
            Write-Host "Installer built: $($inst.Name) ($($inst.Length) bytes)"
          }

      - name: Upload unsigned x64 installer
        if: ${{ inputs.include_installer == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HyperWhisper-win-x64-installer-unsigned
          path: app/windows-installers/HyperWhisper-*-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
